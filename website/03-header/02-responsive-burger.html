<!--
  03-header — Responsive burger
  Показывает: бургер-меню на CSS (checkbox hack), nav скрывается на mobile.
  Смотри: уменьши окно < 768px, открой меню.
-->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 — Responsive burger</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-border: #e2e8f0;
        --color-text: #0f172a;
        --color-muted: #64748b;
        --color-accent: #2563eb;
        --container-max: 72rem;
        --gutter: 1rem;
        --breakpoint: 768px;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
        color: var(--color-text);
        background: var(--color-bg);
      }

      img {
        display: block;
        max-width: 100%;
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }

      .site-header__inner {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 4rem;
      }

      .logo {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--color-text);
        text-decoration: none;
      }

      .nav-toggle {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .burger {
        display: none;
        padding: 0.5rem;
        font-size: 1.5rem;
        line-height: 1;
        color: var(--color-text);
        cursor: pointer;
        background: none;
        border: none;
        border-radius: 0.25rem;
      }

      .burger:hover {
        background: var(--color-bg);
      }

      .nav {
        display: flex;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav a {
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--color-muted);
        text-decoration: none;
      }

      .nav a:hover {
        color: var(--color-text);
      }

      .cta {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        background: var(--color-accent);
        border-radius: 0.375rem;
      }

      @media (max-width: 767px) {
        .burger {
          display: block;
        }

        .nav-wrapper {
          display: contents;
        }

        .nav {
          display: none;
          flex-direction: column;
          gap: 0;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          padding: 0.5rem;
          background: var(--color-surface);
          border-bottom: 1px solid var(--color-border);
          box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .nav li {
          border-bottom: 1px solid var(--color-border);
        }

        .nav li:last-child {
          border-bottom: none;
        }

        .nav a {
          display: block;
          padding: 0.75rem 1rem;
        }

        .nav-toggle:checked ~ .nav-wrapper .nav {
          display: flex;
        }

        .cta {
          display: none;
        }

        .nav-toggle:checked ~ .nav-wrapper .nav .nav-cta {
          display: list-item;
        }

        .nav-cta a {
          color: var(--color-accent);
          font-weight: 600;
        }
      }

      @media (min-width: 768px) {
        .nav-cta {
          display: none;
        }
      }

      .demo-content {
        padding-block: 3rem;
      }

      .demo-content h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }

      .demo-content p {
        margin: 0;
        color: var(--color-muted);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="#">Acme</a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="burger" aria-label="Открыть меню">☰</label>

        <div class="nav-wrapper">
          <ul class="nav">
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">About</a></li>
            <li class="nav-cta"><a href="#">Sign up</a></li>
          </ul>
        </div>

        <a class="cta" href="#">Sign up</a>
      </div>
    </header>

    <main class="container demo-content">
      <h1>Responsive burger</h1>
      <p>
        Уменьши окно браузера до &lt; 768px. Нажми ☰ — меню раскроется.
        Паттерн: checkbox + :checked ~ .nav { display: flex }.
      </p>
    </main>
  </body>
</html>
