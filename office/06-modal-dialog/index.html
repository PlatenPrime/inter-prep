<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 — Modal Dialog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Модальное окно</h1>
    <p class="task-desc">
      Задание: кнопка открывает модалку с overlay. Закрытие по крестику, клику на overlay и Escape.
      Блокировка скролла body. Фокус переходит в модалку.
    </p>
  </header>

  <main class="demo">
    <button type="button" class="btn btn--primary" id="openModal">Открыть модалку</button>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">
      <header class="modal__header">
        <h2 id="modalTitle">Подтверждение</h2>
        <button type="button" class="modal__close" data-close aria-label="Закрыть">×</button>
      </header>
      <div class="modal__body">
        <p>Вы уверены, что хотите удалить этот элемент? Действие необратимо.</p>
      </div>
      <footer class="modal__footer">
        <button type="button" class="btn" data-close>Отмена</button>
        <button type="button" class="btn btn--danger" id="confirmBtn">Удалить</button>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
