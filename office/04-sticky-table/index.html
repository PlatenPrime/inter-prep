<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 — Sticky Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>Таблица со sticky-шапкой</h1>
    <p class="task-desc">
      Задание: таблица с большим количеством строк в скроллируемом контейнере.
      Заголовок (thead) остаётся видимым при прокрутке. Zebra-строки, сортировка по клику на колонку.
    </p>
  </header>

  <div class="table-wrap">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th scope="col" data-sort="id" class="sortable">ID</th>
          <th scope="col" data-sort="name" class="sortable">Имя</th>
          <th scope="col" data-sort="role" class="sortable">Роль</th>
          <th scope="col" data-sort="status" class="sortable">Статус</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
